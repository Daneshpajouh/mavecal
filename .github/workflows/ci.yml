name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint and type-check
        run: make lint
      - name: Unit, edge-case and workflow tests
        run: make test
      - name: Snakemake rule tests
        run: make rule-tests
