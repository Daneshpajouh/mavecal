name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Test
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" build
          make lint test
      - name: Build sdist and wheel
        run: .venv/bin/python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file CHANGELOG.md

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test on the fixtures, push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}
          docker build -t "$image" .
          docker run --rm --entrypoint python "$image" -m pytest -q
          docker push "$image"
