$schema: "https://json-schema.org/draft/2020-12/schema"
description: One row per MaveDB score set
type: object
properties:
  id: {type: string, pattern: "^[a-z0-9_]+$"}
  urn: {type: string, pattern: "^urn:mavedb:\\d{8}-[a-z0-9]+-\\d+$"}
  gene: {type: string}
  assay: {type: string}
  pmid: {type: [string, integer]}
  doi: {type: string}
  published: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  direction: {type: string, enum: [lower_is_abnormal, higher_is_abnormal]}
  level: {type: string, enum: [protein, nucleotide]}
  transcript: {type: string, pattern: "^N[MR]_\\d+$"}
  protein: {type: string, pattern: "^NP_\\d+\\.\\d+$"}
  t2_abnormal: {type: [string, "null"]}
  t2_normal: {type: [string, "null"]}
required: [id, urn, gene, direction, level, transcript, protein, published]
